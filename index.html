<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>sagescloud</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
        rel="stylesheet"
    >

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">
        <span class="topbar__label">sagescloud</span>
    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main>

        <!-- =========================
             INTRO / HERO
        ========================== -->

        <section class="intro">

            <div class="intro__content">

                <h1 class="intro__title">
                    hello, i'm
                    <span class="intro__name">sagnika</span>
                    <span class="intro__spark" aria-hidden="true">⋆.˚</span>
                </h1>

                <p class="intro__text">
                    i make things for the web, write about the things
                    that stay on my mind, and follow interesting ideas
                    wherever they lead.
                </p>

            </div>


            <!-- =========================
                 PHOTO COMPOSITION
            ========================== -->

            <div class="photo-wrap">

                <!-- Decorative flower -->
                <img
                    src="assets/art2.jpeg"
                    alt=""
                    class="doodle doodle--flower"
                    aria-hidden="true"
                >

                <!-- Decorative vine -->
                <img
                    src="assets/art1.jpeg"
                    alt=""
                    class="doodle doodle--vine"
                    aria-hidden="true"
                >

                <!-- Main photo -->
                <figure class="photo-frame">

                    <div class="photo-frame__inner">

                        <!-- Temporary photo placeholder -->
                        <div class="photo-frame__placeholder">
                            <span>your photo here</span>
                        </div>

                    </div>

                </figure>

            </div>

        </section>


        <!-- =========================
             FOLDER NAVIGATION
        ========================== -->

        <nav class="folders" aria-label="site sections">

            <a href="#about" class="folder folder--about">
                <img
                    src="assets/folder_icon.png"
                    alt=""
                    class="folder__icon"
                    aria-hidden="true"
                >
                <span class="folder__label">about</span>
            </a>


            <a href="#currently" class="folder folder--currently">
                <img
                    src="assets/folder_icon.png"
                    alt=""
                    class="folder__icon"
                    aria-hidden="true"
                >
                <span class="folder__label">currently</span>
            </a>


            <a href="#work" class="folder folder--work">
                <img
                    src="assets/folder_icon.png"
                    alt=""
                    class="folder__icon"
                    aria-hidden="true"
                >
                <span class="folder__label">work</span>
            </a>


            <a href="#contact" class="folder folder--contact">
                <img
                    src="assets/folder_icon.png"
                    alt=""
                    class="folder__icon"
                    aria-hidden="true"
                >
                <span class="folder__label">contact</span>
            </a>


            <a href="#archive" class="folder folder--archive">
                <img
                    src="assets/folder_icon.png"
                    alt=""
                    class="folder__icon"
                    aria-hidden="true"
                >
                <span class="folder__label">archive</span>
            </a>

        </nav>


        <!-- =========================
             FUTURE SECTIONS
             
             These are placeholders for now.
             We'll build them one at a time.
        ========================== -->

        <section id="about" class="page-section">
            <!-- About section will go here -->
        </section>


        <section id="currently" class="page-section">
            <!-- Currently section will go here -->
        </section>


        <section id="work" class="page-section">
            <!-- Work / projects section will go here -->
        </section>


        <section id="contact" class="page-section">
            <!-- Contact section will go here -->
        </section>


        <section id="archive" class="page-section">
            <!-- Archive section will go here -->
        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="bottombar">
        <p class="bottombar__label">
            made with intention · sagescloud · 2026
        </p>
    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
