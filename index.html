<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sagescloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="star-cursor">✦</div>
  
  <header class="topbar">
    <span class="topbar__label">sagescloud</span>
  </header>

  <main class="desktop">
    <div class="stage">

      <section class="intro">
        <h1 class="intro__title">hello, i'm <span class="intro__name">sagnika</span><span class="intro__spark">⋆.𐙚 ̊</span></h1>
        <p class="intro__text">i make things for the web, write about the things that stay on my mind, and follow interesting ideas wherever they lead.</p>

        <div class="photo-wrap">
          <img src="assets/art2.jpeg" alt="" class="doodle doodle--flower" aria-hidden="true">
          <img src="assets/art1.jpeg" alt="" class="doodle doodle--vine" aria-hidden="true">
          <figure class="photo-frame">
            <div class="photo-frame__inner">
             <img src="assets/photo.jpg" alt="sagnika" class="photo-frame__image">
             </div>
            </div>
          </figure>
        </div>
      </section>

      <nav class="folders" aria-label="site sections">
        <a href="#about" class="folder folder--about">
          <img src="assets/folder_icon.png" alt="" class="folder__icon">
          <span class="folder__label">about</span>
        </a>
        <a href="#currently" class="folder folder--currently">
          <img src="assets/folder_icon.png" alt="" class="folder__icon">
          <span class="folder__label">currently</span>
        </a>
        <a href="#work" class="folder folder--work">
          <img src="assets/folder_icon.png" alt="" class="folder__icon">
          <span class="folder__label">work</span>
        </a>
        <a href="#contact" class="folder folder--contact">
          <img src="assets/folder_icon.png" alt="" class="folder__icon">
          <span class="folder__label">contact</span>
        </a>
        <a href="#archive" class="folder folder--archive">
          <img src="assets/folder_icon.png" alt="" class="folder__icon">
          <span class="folder__label">archive</span>
        </a>
      </nav>

    </div>
  </main>

  <footer class="bottombar">
    <p class="bottombar__label">made with intention&nbsp; &middot; &nbsp;sagescloud&nbsp; &middot; &nbsp;2026</p>
  </footer>

  <!-- ---------- dialogue window ---------- -->

<div class="dialog" id="dialog" aria-hidden="true">
  <div class="dialog__window" role="dialog" aria-modal="true" aria-labelledby="dialog-title">

    <div class="dialog__bar">
      <span class="dialog__title" id="dialog-title">about</span>

      <button class="dialog__close" type="button" aria-label="Close window">
        ×
      </button>
    </div>

    <div class="dialog__content" id="dialog-content">
      <!-- content gets inserted by JavaScript -->
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
